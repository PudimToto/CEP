<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Sorte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
        <table>
            <tr>
                <td>
                    <header>
                        <h1>Jogo de Sorte</h1>
                        <p>O Jogo é bem simples pessoal, você tem que adivinhar este número que esta entre 1 a 100 que esta censurado aqui em baixo, e você tem 10 chances. Eu sempre vou te dar dicas</p>
                    </header>
                </td>
            </tr>
            <tr>
                <td>
                    <h2 id="resposta"></h2>
                    <br>
                    <label for="numero">Qual número você acha que é?</label>
                        <br>
                    <input type="number" id="numero" required>
                    
                    <p id="dica"></p>
                    <p id="tentativas"></p>

                    <button id="botao" onclick="Game()">Chutar</button>
                </td>
            </tr>
        </table>
    </center>
</body>
<script src="script.js"></script>
</html>
